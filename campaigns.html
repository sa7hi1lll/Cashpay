<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaigns - Sa7hil</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="dashboard.html"><img src="logo.png"><span>Sa7hil</span></a><nav><a href="dashboard.html">Dashboard</a><a class="active" href="campaigns.html">Campaigns</a><a href="reports.html">Reports</a><a href="wallet.html">Wallet</a><a href="profile.html">Profile</a></nav></header><main class="container"><div class="row"><h1>Campaigns</h1><button class="btn" onclick="createBox.classList.toggle('hidden')">+ New Campaign</button></div><section id="createBox" class="card hidden"><input id="name" placeholder="Campaign name"><textarea id="description" placeholder="Description"></textarea><input id="category" placeholder="Category"><input id="goal" type="number" placeholder="Goal ₹"><input id="image" placeholder="Image URL (optional)"><button class="btn" id="create">Create & Generate Link</button><p id="msg" class="muted"></p></section><section id="list" class="grid"></section></main><script type="module">import{auth,onAuthStateChanged,db,collection,addDoc,getDocs,query,orderBy,serverTimestamp}from"./firebase.js";let user;const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");onAuthStateChanged(auth,u=>{if(!u){location.href="login.html";return}user=u;load()});create.onclick=async()=>{if(!name.value.trim())return msg.textContent="Campaign name required";try{const r=await addDoc(collection(db,"campaigns"),{ownerId:user.uid,name:name.value.trim(),description:description.value.trim(),category:category.value.trim(),goal:Number(goal.value)||0,image:image.value.trim(),views:0,participants:0,status:"Pending",createdAt:serverTimestamp()});const u=new URL("campaign.html",location.href);u.searchParams.set("id",r.id);try{await navigator.clipboard.writeText(u.href)}catch(_){}msg.textContent="Created. Link: "+u.href;load()}catch(e){msg.textContent=e.message}};async function load(){const s=await getDocs(query(collection(db,"campaigns"),orderBy("createdAt","desc")));list.innerHTML="";s.forEach(d=>{const c=d.data();if(c.ownerId!==user.uid)return;const u=new URL("campaign.html",location.href);u.searchParams.set("id",d.id);list.insertAdjacentHTML("beforeend",`<article class="card"><h2>${esc(c.name)}</h2><p>${esc(c.description)}</p><p>Status: ${esc(c.status)}</p><button class="btn" onclick="navigator.clipboard.writeText('${u.href}');alert('Link copied')">Copy Link</button> <a class="btn secondary" href="${u.href}">Preview</a></article>`)})}</script></body></html>
