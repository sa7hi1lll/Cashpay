<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campaign - Sa7hil</title><link rel="stylesheet" href="style.css"></head><body><header class="topbar"><a class="brand" href="index.html"><img src="logo.png"><span>Sa7hil</span></a></header><main class="container"><section id="box" class="card">Loading...</section></main><script type="module">import{db,doc,getDoc,updateDoc,increment}from"https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";import{db as firestore}from"./firebase.js";const id=new URLSearchParams(location.search).get("id");const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");if(!id)box.innerHTML="<h2>Campaign not found</h2>";else{try{const r=await getDoc(doc(firestore,"campaigns",id));if(!r.exists())box.innerHTML="<h2>Campaign not found</h2>";else{const c=r.data();await updateDoc(doc(firestore,"campaigns",id),{views:increment(1)});box.innerHTML=`${c.image?`<img src="${esc(c.image)}" style="width:100%;max-height:420px;object-fit:cover;border-radius:14px">`:''}<h1>${esc(c.name)}</h1><p>${esc(c.description)}</p><p>👁️ ${Number(c.views||0)+1} views &nbsp; 👥 ${Number(c.participants||0)} participants</p><button class="btn" id="join">Join Campaign</button> <button class="btn secondary" id="share">Share</button>`;join.onclick=async()=>{await updateDoc(doc(firestore,"campaigns",id),{participants:increment(1)});alert("Thanks for joining!")};share.onclick=async()=>{try{await navigator.share({title:c.name,url:location.href})}catch(_){await navigator.clipboard.writeText(location.href);alert("Link copied")}}}}catch(e){box.innerHTML="<h2>Error loading campaign</h2><p>"+esc(e.message)+"</p>"}}</script></body></html>
