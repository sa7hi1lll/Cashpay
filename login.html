<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Sa7hil</title><link rel="stylesheet" href="style.css"></head>
<body>
<main class="auth">
  <section class="card auth-card">
    <img src="logo.png" class="auth-logo" alt="Sa7hil">
    <h1>Welcome back</h1>
    <p>Login to your Sa7hil account.</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="btn" onclick="demoLogin()">Login</button>
    <p class="muted">For production, connect Firebase Authentication in <code>script.js</code>.</p>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
